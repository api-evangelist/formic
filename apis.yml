aid: formic
name: Formic
description: >-
  Formic is a Chicago, Illinois-based Robotics-as-a-Service (RaaS) company
  founded in 2020 by Saman Farid that delivers full-service industrial
  automation to American manufacturers on a pay-per-hour, fixed monthly
  subscription model with no capital expenditure. Formic specializes in
  end-of-line manufacturing operations — palletizing, case packing, and
  robotic pallet wrapping — and pairs deployed robots with a 24/7 remote
  monitoring, support, and field-service operation. The company's software
  stack includes Formic Core, an embedded operating system that abstracts
  motion, vision, sensing, and real-time coordination across heterogeneous
  industrial robot hardware (Fanuc, ABB, Kuka, Doosan) behind unified
  control interfaces; Formic Cortex; the Colony 2.0 fleet dashboard; FAST
  configuration tools; and Formic Production Intelligence (FPI), a
  manufacturer-facing analytics surface. Formic has raised more than $86M
  across rounds led by Lux Capital, Blackhorn Ventures, and other investors,
  and works through a network of 100+ system-integrator partners with 500+
  systems deployed. Formic's revenue model is the RaaS subscription itself;
  there is no public developer API, no published SDKs, and no public
  customer-portal API documentation. Formic Core's "unified APIs" are
  internal abstractions used by Formic engineers and integrator partners to
  drive robot hardware — they are not exposed to manufacturers or third-party
  developers.
